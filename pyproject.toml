[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-environment-monitor"
version = "1.0.0"
description = "ESP32 warehouse monitoring with local alarms, microSD logging and a Firebase dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "playwright==1.64.1", "ruff==0.17.3"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
