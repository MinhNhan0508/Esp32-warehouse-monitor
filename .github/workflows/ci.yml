name: Build & Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: Warehouse tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install native C compiler and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc
          python -m pip install -r requirements.lock
          python -m playwright install --with-deps chromium
      - name: Static checks
        run: |
          python -m ruff check tools tests
          python -m ruff format --check tools tests
      - name: C logic, configuration, wiring, package and dashboard tests
        run: python -m pytest tests -q --ignore=tests/test_firebase_rules.py --junitxml=.build/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-test-results
          path: |
            .build/tests.xml
            .build/warehouse-*-output.txt

  esp32-compile:
    name: ESP32 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.0'
      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install --no-deps 'DHT sensor library for ESPx@1.19.0' 'Adafruit SSD1306@2.5.17' 'Adafruit GFX Library@1.13.0' 'Adafruit BusIO@1.17.4' 'ArduinoJson@7.3.2'
      - name: Package source and build merged firmware with cloud disabled
        run: |
          python tools/wokwi.py bundle
          python tools/warehouse_firmware.py
      - name: Compile enabled-cloud profile with dummy identifiers
        run: |
          python tools/warehouse_compile_profile.py
          arduino-cli compile --fqbn esp32:esp32:esp32 --jobs 2 --warnings all --build-path .build/esp32/cloud-profile .build/cloud-profile/warehouse-local

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test tools
        run: |
          python -m pip install -r requirements.lock
          npm install --global firebase-tools@15.34.2
      - name: Test local Auth and Database Rules
        run: env -u DEBUG firebase emulators:exec --project demo-warehouse --only auth,database 'python -m pytest tests/test_firebase_rules.py -q --junitxml=.build/firebase-rules-tests.xml'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-rules-results
          path: .build/firebase-rules-tests.xml
